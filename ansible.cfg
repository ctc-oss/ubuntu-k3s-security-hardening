[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
gathering = smart
fact_caching = memory
# stdout_callback = default  # Using default callback (yaml format available via result_format=yaml in newer versions)
interpreter_python = auto_silent

[privilege_escalation]
# become = True  # Not set globally - use become: yes in playbooks or --become flag for ad-hoc commands
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

