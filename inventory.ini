[k3s_master]
master ansible_host=IP  ansible_user=admin

[k3s_workers]
worker ansible_host=IP  ansible_user=admin

[k3s_cluster:children]
k3s_master
k3s_workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_become=yes
ansible_become_method=sudo
# ansible_ssh_private_key_file=~/.ssh/id_rsa
# ansible_become_pass=your_sudo_password_here  # Uncomment and set if passwordless sudo is not configured

